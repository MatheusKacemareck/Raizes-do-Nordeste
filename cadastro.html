<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cadastro | Raízes do Nordeste</title>
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body data-page="login">
        <header id="cabecalho"></header>
        <main id="conteudo">
            <section class="page-hero">
                <div class="container">
                    <h1>Crie sua conta</h1>
                    <p>Seus dados ficam somente neste dispositivo.</p>
                </div>
            </section>
            <section class="section container">
                <form id="cadastro-form" class="form-card">
                    <label>
                        Nome completo
                        <input name="nome" minlength="3" required autocomplete="name">
                    </label>
                    <label>
                        E-mail
                        <input type="email" name="email" required autocomplete="email">
                    </label>
                    <label>
                        Telefone
                        <input name="telefone" inputmode="tel" required autocomplete="tel">
                    </label>
                    <label>
                        Senha
                        <input type="password" name="senha" minlength="6" required autocomplete="new-password">
                        <small>Use uma senha com no mínimo 6 caracteres.</small>
                    </label>
                    <label class="lgpd-consent">
                        <input type="checkbox" name="lgpd" required>
                        <span>
                            Confirmo que li e aceito a
                            <a href="lgpd.html">Política de Privacidade</a>
                            . Meus dados serão tratados conforme a Lei Geral de Proteção de Dados (LGPD).
                        </span>
                    </label>
                    <button class="button primary">Cadastrar</button>
                    <p class="form-status" role="status"></p>
                </form>
            </section>
        </main>
        <footer id="rodape"></footer>
        <button id="back-top" aria-label="Voltar ao topo">↑</button>
        <script src="js/mock.js"></script>
        <script src="js/app.js"></script>
        <script src="js/cadastro.js"></script>
    </body>
</html>
