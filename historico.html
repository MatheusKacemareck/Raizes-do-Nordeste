<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Histórico de pedidos | Raízes do Nordeste</title>
        <meta name="description" content="Consulte os pedidos registrados na sua conta do Raízes do Nordeste.">
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/historico.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer">
    </head>
    <body data-page="login">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
        <header id="cabecalho"></header>
        <main id="conteudo">
            <section class="page-hero history-hero">
                <div class="container">
                    <span class="eyebrow">Minha conta</span>
                    <h1>Histórico de pedidos</h1>
                    <p>Acompanhe os pedidos em andamento.</p>
                </div>
            </section>
            <section class="section container history-section">
                <div class="history-toolbar">
                    <div>
                        <h2>Meus pedidos</h2>
                        <p id="history-count">Carregando...</p>
                    </div>
                    <a class="button primary" href="index.html">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        Novo pedido
                    </a>
                </div>
                <div id="history-list" class="history-list" aria-live="polite"></div>
            </section>
        </main>
        <footer id="rodape"></footer>
        <button id="back-top" aria-label="Voltar ao topo">↑</button>
        <script src="js/mock.js"></script>
        <script src="js/app.js"></script>
        <script src="js/historico.js"></script>
    </body>
</html>
