<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Recuperar senha | Raízes do Nordeste</title>
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body class="auth-page">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
        <main id="conteudo" class="auth-shell">
            <section class="auth-card" aria-labelledby="recovery-title">
                <a class="auth-brand" href="index.html">
                    <img src="assets/logo.png" alt="Raízes do Nordeste">
                </a>
                <div class="auth-intro">
                    <span>Recuperação local</span>
                    <h1 id="recovery-title">Defina uma nova senha</h1>
                    <p>Confirme o e-mail cadastrado neste dispositivo.</p>
                </div>
                <form id="recovery-form" class="auth-form">
                    <label for="recovery-email">E-mail</label>
                    <div class="auth-field">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input id="recovery-email" type="email" name="email" required autocomplete="email">
                    </div>
                    <label for="recovery-password">Nova senha</label>
                    <div class="auth-field">
                        <i class="fa-solid fa-key" aria-hidden="true"></i>
                        <input id="recovery-password" type="password" name="senha" minlength="6" required autocomplete="new-password">
                    </div>
                    <label for="recovery-confirm">Confirme a nova senha</label>
                    <div class="auth-field">
                        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        <input id="recovery-confirm" type="password" name="confirmacao" minlength="6" required autocomplete="new-password">
                    </div>
                    <small class="password-hint">Use uma senha com no mínimo 6 caracteres.</small>
                    <button class="auth-submit" type="submit">Atualizar senha</button>
                    <p class="form-status" role="status"></p>
                </form>
                <p class="recovery-note">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                    Simulação de Recuperação.
                </p>
                <a class="back-menu" href="login.html">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    Voltar ao login
                </a>
            </section>
        </main>
        <script src="js/recuperar-senha.js"></script>
    </body>
</html>
