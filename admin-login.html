<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Acesso administrativo | Raízes do Nordeste</title>
        <meta name="description" content="Acesso ao painel administrativo do Raízes do Nordeste.">
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    </head>
    <body class="auth-page">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

        <main id="conteudo" class="auth-shell">
            <section class="auth-card" aria-labelledby="admin-login-title">
                <a class="auth-brand" href="index.html" aria-label="Voltar ao cardápio">
                    <img src="assets/logo.png" alt="Raízes do Nordeste">
                </a>

                <div class="auth-intro">
                    <span>Acesso restrito</span>
                    <h1 id="admin-login-title">Administração</h1>
                    <p>Entre com a conta administrativa autorizada.</p>
                </div>

                <form id="admin-login-form" class="auth-form">
                    <label for="admin-email">E-mail</label>
                    <div class="auth-field">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input id="admin-email" type="email" name="email" required autocomplete="username">
                    </div>

                    <label for="admin-password">Senha</label>
                    <div class="auth-field">
                        <i class="fa-solid fa-key" aria-hidden="true"></i>
                        <input id="admin-password" type="password" name="senha" required autocomplete="current-password">
                    </div>

                    <button class="auth-submit" type="submit">Entrar no painel</button>
                    <p class="form-status" role="status"></p>
                </form>

                <div class="admin-test-account">
                    <strong>Conta administrativa para teste</strong>
                    <span>E-mail: administrador@raizes.com</span>
                    <span>Senha: Admin@2026</span>
                </div>

                <p class="privacy-note"><i class="fa-solid fa-lock" aria-hidden="true"></i> Não existe cadastro para novo admin.</p>
                <a class="back-menu" href="login.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao login do cliente</a>
            </section>
        </main>

        <script src="js/admin-auth.js"></script>
    </body>
</html>
